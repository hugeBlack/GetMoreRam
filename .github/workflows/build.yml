name: Build unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test authentication configuration
        run: |
          swiftc GetMoreRam/AuthenticationConfiguration.swift Tests/AuthenticationConfiguration/main.swift -o "$RUNNER_TEMP/configuration-tests"
          "$RUNNER_TEMP/configuration-tests"
      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project GetMoreRam.xcodeproj -scheme GetMoreRam \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/GetMoreRam.xcarchive \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload dist
          cp -R build/GetMoreRam.xcarchive/Products/Applications/GetMoreRam.app build/ipa/Payload/
          ditto -c -k --norsrc --keepParent build/ipa/Payload dist/GetMoreRam-WindowsAuth.ipa
          shasum -a 256 dist/GetMoreRam-WindowsAuth.ipa > dist/GetMoreRam-WindowsAuth.ipa.sha256
          unzip -t dist/GetMoreRam-WindowsAuth.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: GetMoreRam-WindowsAuth
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GetMoreRam-WindowsAuth
          path: dist
      - name: Publish installable download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: windows-auth-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$COMMIT" \
            --title "GetMoreRam Windows authentication ($RELEASE_TAG)" \
            --notes 'Unsigned arm64 IPA. Install through SideStore. Defaults use the Windows/iTunes client info and akd/1.0 CFNetwork/808.1.4 user agent. Apple ID sign-in and Increased Memory Limit registration still require testing on your iPhone.'
